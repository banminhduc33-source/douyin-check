name: douyin
on:
  # Chạy 1 lần mỗi khi có file được thêm/sửa trong thư mục doyin/
  push:
    paths:
      - "doyin/**"
  workflow_dispatch:

concurrency:
  group: douyin
  cancel-in-progress: false

permissions:
  contents: write   # cần cho bước keepalive

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài thư viện
        run: pip install websocket-client google-api-python-client google-auth-oauthlib

      - name: Tải Lightpanda
        run: |
          curl -fL -o lightpanda https://github.com/lightpanda-io/browser/releases/download/nightly/lightpanda-x86_64-linux
          chmod +x lightpanda

      - name: Tạo token.json
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: printf '%s' "$TOKEN_JSON" > token.json

      - name: Chạy
        run: python lp_douyin.py link_unique.txt --lp-path ./lightpanda --workers 5 --min-time 3 --max-hours 2 --sort time --timeout 10

      - name: Lưu bản sao kết quả
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ketqua
          path: doyin/*.html
          retention-days: 1

      - name: Keepalive (giữ repo sống nếu 30 ngày chưa có commit)
        if: always()
        run: |
          LAST=$(git log -1 --format=%ct)
          NOW=$(date +%s)
          if [ $(( NOW - LAST )) -gt 2592000 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive"
            git push
          fi
