name: douyin
on:
  schedule:
    - cron: "*/10 0-14 * * *"   # mỗi 10 phút, 07:00-21:50 giờ VN
    - cron: "0 15 * * *"        # 22:00 giờ VN
    - cron: "0 3 1,15 * *"      # keepalive: ngày 1 và 15 hằng tháng
  workflow_dispatch:

jobs:
  run:
    # Chạy khi không phải cron keepalive (gồm cả bấm tay)
    if: github.event.schedule != '0 3 1,15 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    concurrency:
      group: douyin
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài thư viện
        run: pip install websocket-client google-api-python-client google-auth-oauthlib

      - name: Tải Lightpanda
        run: |
          curl -fL -o lightpanda https://github.com/lightpanda-io/browser/releases/download/nightly/lightpanda-x86_64-linux
          chmod +x lightpanda

      - name: Tạo token.json
        env:
          TOKEN_JSON: ${{ secrets.TOKEN_JSON }}
        run: printf '%s' "$TOKEN_JSON" > token.json

      - name: Chạy
        run: python lp_douyin.py link_unique.txt --lp-path ./lightpanda --workers 5 --min-time 3 --max-hours 2 --sort time --timeout 10

      - name: Lưu bản sao kết quả
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ketqua
          path: doyin/*.html
          retention-days: 1

  keepalive:
    # Chỉ chạy khi đúng cron keepalive
    if: github.event.schedule == '0 3 1,15 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Commit rỗng để reset bộ đếm 60 ngày
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive"
          git push
